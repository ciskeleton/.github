name: Release
run-name: Release ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Project Release
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 0️⃣ Validate tag release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::This workflow only supports tag releases. Current ref: $GITHUB_REF"
            exit 1
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable SemVer tags are handled by this workflow: $TAG_NAME"
            exit 1
          fi

      - name: 1️⃣ Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 2️⃣ Set up variables
        id: vars
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          NAME="${{ inputs.name }}"
          ZIP_NAME="app-${TAG_NAME}.zip"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "zip=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: 3️⃣ Prepare ZIP contents
        run: |
          if [ ! -d "src" ]; then
            echo "::error::src not found"
            exit 1
          fi

          mkdir "app"

          cp -r src/* "app/"

          for f in README.md LICENSE.md; do
            if [ -f "$f" ]; then
              cp "$f" "app/"
            fi
          done

      - name: 4️⃣ Create ZIP archive
        run: |
          zip -r "${{ steps.vars.outputs.zip }}" "app"

      - name: 5️⃣ Create GitHub Release and Upload ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: ${{ steps.vars.outputs.zip }}
