name: Release System Package
run-name: Release ${{ inputs.package }} ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

      directory:
        required: false
        type: string
        default: ''

      copy_docs:
        required: false
        type: boolean
        default: true

    secrets:
      IANHUB_AGENT_CLIENT_ID:
        required: true
      IANHUB_AGENT_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: System Package Release
    runs-on: ubuntu-latest

    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}

    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 0️⃣ Validate tag release
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::This workflow only supports tag releases. Current ref: $GITHUB_REF"
            exit 1
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable SemVer tags are handled by this workflow: $TAG_NAME"
            exit 1
          fi

          if [[ "$PACKAGE" != "core" && "$PACKAGE" != "common" ]]; then
            echo "::error::Invalid system package: $PACKAGE"
            exit 1
          fi

      - name: 1️⃣ Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 2️⃣ Create ianhub-agent token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.IANHUB_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.IANHUB_AGENT_PRIVATE_KEY }}
          owner: ciskeleton

      - name: 3️⃣ Configure GitHub auth and identity
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "ianhub-agent[bot]"
          git config --global user.email "ianhub-agent[bot]@users.noreply.github.com"

      - name: 4️⃣ Set up variables
        id: vars
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          DIRECTORY: ${{ inputs.directory }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ZIP_NAME="${PACKAGE}-${TAG_NAME}.zip"

          if [ -z "$DIRECTORY" ]; then
            DIRECTORY="$PACKAGE"
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: 5️⃣ Prepare ZIP contents
        shell: bash
        env:
          DIRECTORY: ${{ steps.vars.outputs.directory }}
          COPY_DOCS: ${{ inputs.copy_docs }}
        run: |
          if [ ! -d "src" ]; then
            echo "::error::src not found"
            exit 1
          fi

          mkdir "$DIRECTORY"
          cp -r src/* "$DIRECTORY/"

          if [ "$COPY_DOCS" = "true" ]; then
            for f in README.md LICENSE.md; do
              if [ -f "$f" ]; then
                cp "$f" "$DIRECTORY/"
              fi
            done
          fi

      - name: 6️⃣ Create ZIP archive
        shell: bash
        run: |
          zip -r "${{ steps.vars.outputs.zip }}" "${{ steps.vars.outputs.directory }}"

      - name: 7️⃣ Calculate ZIP SHA256
        id: checksum
        shell: bash
        run: |
          ZIP="${{ steps.vars.outputs.zip }}"
          SHA256=$(sha256sum "$ZIP" | cut -d ' ' -f 1)

          echo "📦 ZIP: $ZIP"
          echo "🔐 SHA256: $SHA256"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: 8️⃣ Create GitHub Release and Upload ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: ${{ steps.vars.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  dispatch:
    name: Notify Packages
    runs-on: ubuntu-latest
    needs: release

    concurrency:
      group: dispatch-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 1️⃣ Create ianhub-agent token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.IANHUB_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.IANHUB_AGENT_PRIVATE_KEY }}
          owner: ciskeleton

      - name: 2️⃣ Trigger update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ciskeleton/packages
          event-type: update-package
          client-payload: |
            {
              "repo": "${{ github.repository }}",
              "type": "system",
              "name": "${{ inputs.package }}",
              "sha256": "${{ needs.release.outputs.sha256 }}"
            }
